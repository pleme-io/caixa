[workspace]
resolver = "2"
members = [
    "caixa-core",
    "caixa-lacre",
    "caixa-ast",
    "caixa-theme",
    "caixa-fmt",
    "caixa-lint",
    "caixa-resolver",
    "caixa-lsp",
    "caixa-teia",
    "caixa-teia-forge",
    "caixa-provedor",
    "caixa-flake",
    "caixa-feira",
    "caixa-crd",
    "caixa-operator",
    "caixa-pangea",
    "caixa-arch",
    "caixa-helm",
    "caixa-flux",
    "caixa-mesh",
    "caixa-tatara",
    "caixa-actions",
]

[workspace.package]
version = "0.1.240"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/caixa"
homepage = "https://github.com/pleme-io/caixa"
authors = ["pleme-io"]
readme = "README.md"
categories = ["development-tools", "api-bindings"]
keywords = ["caixa", "tatara-lisp", "pleme-io", "helm", "packaging"]

[workspace.dependencies]
# Workspace-internal crates (path deps).
caixa-core = { path = "caixa-core", version = "0.1.240" }
caixa-lacre = { path = "caixa-lacre", version = "0.1.240" }
caixa-ast = { path = "caixa-ast", version = "0.1.240" }
caixa-theme = { path = "caixa-theme", version = "0.1.240" }
caixa-fmt = { path = "caixa-fmt", version = "0.1.240" }
caixa-lint = { path = "caixa-lint", version = "0.1.240" }
caixa-resolver = { path = "caixa-resolver", version = "0.1.240" }
caixa-teia = { path = "caixa-teia", version = "0.1.240" }
caixa-teia-forge = { path = "caixa-teia-forge", version = "0.1.240" }
caixa-provedor = { path = "caixa-provedor", version = "0.1.240" }
caixa-flake = { path = "caixa-flake", version = "0.1.240" }
caixa-crd = { path = "caixa-crd", version = "0.1.240" }
caixa-pangea = { path = "caixa-pangea", version = "0.1.240" }
caixa-arch = { path = "caixa-arch", version = "0.1.240" }
caixa-helm = { path = "caixa-helm", version = "0.1.240" }
caixa-flux = { path = "caixa-flux", version = "0.1.240" }
caixa-mesh = { path = "caixa-mesh", version = "0.1.240" }
caixa-actions = { path = "caixa-actions", version = "0.1.240" }

# Third-party.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
blake3 = "1.5"
clap = { version = "4", features = ["derive", "env"] }
semver = { version = "1", features = ["serde"] }
hex = "0.4"
dirs = "5"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "fs"] }
tower-lsp = "0.20"
dashmap = "5"
ropey = "1"

# tatara-lisp — the canonical Lisp crate, from crates.io. Depend ONLY on the
# lib: it exact-pins and re-exports its own proc-macros as `DeriveTataraDomain`
# / `DeriveKeywordSexp`, so naming `tatara-lisp-derive` here would let the
# lib↔derive pair drift apart (the split-brain the 0.3.x consolidation sealed).
tatara-lisp = "0.3.26"
# tatara-process, from the registry — the last git dep, now gone. The rev pin
# it replaces held this workspace at 0.2.4 while the registry had moved on, and
# a git source is one cargo cannot unify with a registry source even at an
# identical version, so it doubled the crate downstream AND blocked caixa's own
# publish outright. The version jump is real (the pinned rev and the registry
# generate different derive output), which is why it is taken deliberately here
# rather than deferred again.
tatara-process = "0.2"
caixa-tatara = { path = "caixa-tatara", version = "0.1.240" }
# Registry, at last. This was a git dep only because `iac-forge` had never
# reached crates.io — its release reported SUCCESS while publishing nothing,
# on the substrate's green `dep-missing` defer (fixed at
# pleme-io/actions@aacea54). Published 0.1.5 today once that stopped lying and
# an invalid `code-generators` category slug was corrected.
iac-forge = "0.1"
gen-platform = "0.1"
gen-types = "0.1"
canteiro-types = "0.1"

pretty_assertions = "1"
tempfile = "3"
proptest = "1"
kube = { version = "0.99", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.24", features = ["latest"] }
schemars = { version = "0.8", features = ["chrono"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
