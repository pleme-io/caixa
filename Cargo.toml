[workspace]
resolver = "2"
members = [
    "caixa-core",
    "caixa-lacre",
    "caixa-ast",
    "caixa-theme",
    "caixa-fmt",
    "caixa-lint",
    "caixa-resolver",
    "caixa-lsp",
    "caixa-teia",
    "caixa-teia-forge",
    "caixa-provedor",
    "caixa-flake",
    "caixa-feira",
    "caixa-crd",
    "caixa-operator",
    "caixa-pangea",
    "caixa-arch",
    "caixa-helm",
    "caixa-flux",
    "caixa-mesh",
    "caixa-tatara",
    "caixa-actions",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/caixa"
homepage = "https://github.com/pleme-io/caixa"
authors = ["pleme-io"]
readme = "README.md"
categories = ["development-tools", "api-bindings"]
keywords = ["caixa", "tatara-lisp", "pleme-io", "helm", "packaging"]

[workspace.dependencies]
# Workspace-internal crates (path deps).
caixa-core = { path = "caixa-core", version = "0.1.4" }
caixa-lacre = { path = "caixa-lacre", version = "0.1.4" }
caixa-ast = { path = "caixa-ast", version = "0.1.4" }
caixa-theme = { path = "caixa-theme", version = "0.1.4" }
caixa-fmt = { path = "caixa-fmt", version = "0.1.4" }
caixa-lint = { path = "caixa-lint", version = "0.1.4" }
caixa-resolver = { path = "caixa-resolver", version = "0.1.4" }
caixa-teia = { path = "caixa-teia", version = "0.1.4" }
caixa-teia-forge = { path = "caixa-teia-forge", version = "0.1.4" }
caixa-provedor = { path = "caixa-provedor", version = "0.1.4" }
caixa-flake = { path = "caixa-flake", version = "0.1.4" }
caixa-crd = { path = "caixa-crd", version = "0.1.4" }
caixa-pangea = { path = "caixa-pangea", version = "0.1.4" }
caixa-arch = { path = "caixa-arch", version = "0.1.4" }
caixa-helm = { path = "caixa-helm", version = "0.1.4" }
caixa-flux = { path = "caixa-flux", version = "0.1.4" }
caixa-mesh = { path = "caixa-mesh", version = "0.1.4" }
caixa-actions = { path = "caixa-actions", version = "0.1.4" }

# Third-party.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
blake3 = "1.5"
clap = { version = "4", features = ["derive", "env"] }
semver = { version = "1", features = ["serde"] }
hex = "0.4"
dirs = "5"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "fs"] }
tower-lsp = "0.20"
dashmap = "5"
ropey = "1"

# tatara-lisp — the canonical Lisp crate, from crates.io. Depend ONLY on the
# lib: it exact-pins and re-exports its own proc-macros as `DeriveTataraDomain`
# / `DeriveKeywordSexp`, so naming `tatara-lisp-derive` here would let the
# lib↔derive pair drift apart (the split-brain the 0.3.x consolidation sealed).
tatara-lisp = "0.3.26"
# Remaining pleme-io git deps. Consumers outside pleme-io drive the Nix flake,
# which pins these via inputs.
#
# These two keep the git+version form because NEITHER IS ON crates.io — both
# 404 as of 2026-08-04. `optional = true` was tried as a way to declare that
# and is not one, in two separate ways:
#
#   1. `optional` is REJECTED on a workspace dependency, so the manifest
#      stopped parsing at all. `cargo metadata` fails → `gen build` fails →
#      a HARD EVAL FAILURE for every nix consumer of caixa, which is how this
#      was found (a `darwinConfigurations.cid.system` build, not a caixa one).
#   2. Nothing was optional about them anyway: six members take
#      `iac-forge = { workspace = true }` and two take `tatara-process` the
#      same way, all unconditionally.
#
# The `version` beside `git` is what keeps a future registry release honest —
# cargo resolves from git locally and emits the registry version on release.
# So caixa's own release stays blocked until these two land on crates.io.
# That is a real constraint to carry openly, not one to encode as a manifest
# that does not parse.
# The rev pin is load-bearing, not caution: tatara's main has moved to a
# `tatara-process` that requires `tatara-lisp ^0.3` while the same workspace
# publishes 0.2.x, so resolving unpinned fails outright with "failed to select
# a version for the requirement `tatara-lisp = ^0.3`". This rev is the one
# Cargo.lock already resolves (tatara-process 0.2.4), so pinning here changes
# nothing about what is built — it only stops the resolver wandering into that
# inconsistency. Unpin when tatara's own versions agree again.
tatara-process = { git = "https://github.com/pleme-io/tatara", rev = "fb6dfcc1bad6880c06b774164882ad845522e84a", version = "0.2" }
caixa-tatara = { path = "caixa-tatara", version = "0.1.4" }
iac-forge = { git = "https://github.com/pleme-io/iac-forge", version = "0.1" }
gen-platform = "0.1"
gen-types = "0.1"
canteiro-types = "0.1"

pretty_assertions = "1"
tempfile = "3"
proptest = "1"
kube = { version = "0.99", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.24", features = ["latest"] }
schemars = { version = "0.8", features = ["chrono"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
